[project]
name = "chess-trm-phase1"
version = "0.1.0"
description = "Data Pipeline & DIS Prep for Chess-TRM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15.1",
    "numpy>=2.3.5",
    "python-chess>=1.999",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
